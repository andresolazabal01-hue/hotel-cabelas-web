<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: al abrirse el teclado del celular la ventana se
         encoge de verdad, y la hoja de reserva queda encima del teclado en
         lugar de debajo. Los navegadores que no lo entienden lo ignoran. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Hotel Cabelas — Hospedaje en Mazatenango, Suchitepéquez</title>
    <meta
      name="description"
      content="Hotel Cabelas: hospedaje impecable en el corazón de Mazatenango. Calificación 4.9 en Google, atención 24/7, habitaciones cómodas y seguras. Reserva directa por WhatsApp."
    />
    <!-- El disco de marca con la C recortada del logotipo, la caligrafica,
         en todos los tamanos. Decision de marca por encima de legibilidad:
         a 16 px sus trazos miden 0.34 px de mediana, asi que en la pestana
         se lee como una media luna mas que como una C. Cada tamano del ico
         se rasteriza por separado en lugar de reducir uno grande. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Instrument+Sans:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
